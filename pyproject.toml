[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewguard-local"
version = "0.3.0a1"
description = "Local evidence-aware retraction surveillance for systematic reviews and meta-analyses"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "ReviewGuard contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]

license = "MIT"
dependencies = []

[project.urls]
Repository = "https://github.com/babak-ghadirzadeh/ReviewGuard"
Issues = "https://github.com/babak-ghadirzadeh/ReviewGuard/issues"

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11,<1"]

[project.scripts]
reviewguard = "reviewguard.__main__:main"

[tool.setuptools]
packages = ["reviewguard"]

[tool.setuptools.package-data]
reviewguard = ["resources/*.json"]
